<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NostrixAI PWA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
  <style>
    body { margin:0; font-family:'Inter', sans-serif; background:#000; color:#fff; }
    #app { padding:20px; max-width:800px; margin:auto; }
    input, button { padding:10px; margin:5px 0; font-size:16px; }
    a { color:#0af; text-decoration:none; }
    .result { border:1px solid #222; padding:15px; margin:10px 0; }
  </style>
</head>
<body>
  <div id="app">
    <h1>NostrixAI</h1>
    <input id="query" type="text" placeholder="Enter ticker or search query">
    <button id="send">Search</button>
    <div id="results"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
